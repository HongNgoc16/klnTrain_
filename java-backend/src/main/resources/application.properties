# ===== Server =====
server.port=8080

# ===== Database (SQL Server) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=KLN_Train;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=YourPassword
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.secret=klntrain_super_secret_key_2024_change_in_production
jwt.expiration=86400000

# ===== CORS =====
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# ===== SePay webhook =====
sepay.webhook-token=

# ===== Logging =====
logging.level.com.klntrain=INFO
logging.level.org.springframework.security=WARN
